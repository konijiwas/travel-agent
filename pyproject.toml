[project]
name = "travel-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1,<8.2",
    "fastmcp>=3.0,<5.0",
    "langchain>=1.3,<1.4",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-openai>=1.5,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=2.1,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.0,<7.0",
    "rich>=13.0,<15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
